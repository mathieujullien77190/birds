# Relais du Pi SERVEUR vers le Pi du nichoir.
# Le navigateur ne parle qu'à ce Pi : il sert le site (pi/web/) et renvoie /api/ et /video/ au nichoir.
# À adapter : NICHOIR_IP (adresse du Pi du nichoir) et le chemin de `root` (dossier pi/web/ copié sur le serveur).
# Installation : voir « Héberger le site sur un autre Pi » dans pi/README.md.

server {
    listen 80;                         # port du site, pour le navigateur
    server_name _;                     # n'importe quel nom : le serveur est seul sur ce port

    root /home/pi/nichoir/web;         # le site compilé (index.html, app.js, app.css)
    index index.html;

    location / {
        try_files $uri /index.html;    # le site est une seule page
    }

    location /api/ {                   # l'état, les commandes, l'historique, les réglages
        proxy_pass http://NICHOIR_IP:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;      # nichoir injoignable : la page le sait vite
        proxy_read_timeout 15s;
    }

    location /video/ {                 # flux MJPEG des caméras : un flux continu, jamais mis en tampon
        proxy_pass http://NICHOIR_IP:8080;
        proxy_http_version 1.1;
        proxy_buffering off;           # chaque image est transmise tout de suite
        proxy_read_timeout 1h;         # le flux reste ouvert tant que la page est affichée
    }
}
