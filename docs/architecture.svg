<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Architecture logicielle du nichoir</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2a37"/>
    </marker>
  </defs>
  <rect width="1000" height="690" fill="#ffffff"/>

  <!-- Application racine -->
  <rect x="20" y="20" width="460" height="530" rx="14" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.5"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#1f2a37">Application racine (Vite + React 19, src/)</text>

  <rect x="40" y="62" width="420" height="84" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="250" y="88" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">features/ : couche interface</text>
  <text x="250" y="110" font-size="12.5" text-anchor="middle" fill="#5b6b7c">viewer · schema · docs · laser (un dossier par composant)</text>
  <text x="250" y="130" font-size="12.5" text-anchor="middle" fill="#5b6b7c">partagés : ui/ · hooks/ · lib/ · docs/*.md (?raw)</text>

  <rect x="40" y="176" width="420" height="70" rx="10" fill="#fff7ec" stroke="#b5651d" stroke-width="1.5"/>
  <text x="250" y="202" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">birdhouse/three : couche three.js</text>
  <text x="250" y="224" font-size="12.5" text-anchor="middle" fill="#5b6b7c">scène · registry · fabriques · interactions</text>

  <rect x="40" y="276" width="420" height="70" rx="10" fill="#fff7ec" stroke="#b5651d" stroke-width="1.5"/>
  <text x="250" y="302" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">birdhouse/model : modèle pur</text>
  <text x="250" y="324" font-size="12.5" text-anchor="middle" fill="#5b6b7c">assemblage · géométrie · planches (nest) · fils</text>

  <rect x="40" y="376" width="420" height="50" rx="10" fill="#eaf5ea" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="250" y="406" font-size="13" text-anchor="middle" fill="#1f2a37"><tspan font-weight="700">localStorage</tspan> : modèle, réglages laser, pièces cachées</text>

  <rect x="40" y="456" width="420" height="76" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="250" y="482" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a37">PiSimulator + piSource</text>
  <text x="250" y="504" font-size="12.5" text-anchor="middle" fill="#5b6b7c">Pyodide (CDN jsDelivr) exécute pi/nichoir/*.py</text>
  <text x="250" y="522" font-size="12.5" text-anchor="middle" fill="#5b6b7c">fetch('/api/…') détourné vers les routes Python</text>

  <!-- Fleches internes -->
  <g stroke="#1f2a37" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M250 146 V176"/>
    <path d="M250 246 V276"/>
    <path d="M250 346 V376"/>
    <path d="M460 104 H520"/>
    <path d="M460 494 H520"/>
  </g>
  <g font-size="11.5" fill="#1f2a37">
    <text x="258" y="165">utilise</text>
    <text x="258" y="265">lit</text>
    <text x="258" y="365">persistence.ts</text>
    <text x="490" y="94" text-anchor="middle">@laser</text>
    <text x="490" y="484" text-anchor="middle">source</text>
  </g>

  <!-- laser-control -->
  <rect x="520" y="20" width="460" height="215" rx="14" fill="#f5f0fa" stroke="#7a5aa6" stroke-width="1.5"/>
  <text x="540" y="48" font-size="15" font-weight="700" fill="#1f2a37">laser-control/ (projet autonome)</text>
  <g stroke="#1f2a37" stroke-width="1.5" fill="#ffffff">
    <rect x="540" y="66" width="132" height="86" rx="9"/>
    <rect x="685" y="66" width="132" height="86" rx="9"/>
    <rect x="830" y="66" width="132" height="86" rx="9"/>
  </g>
  <g font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2a37">
    <text x="606" y="92">job</text>
    <text x="751" y="92">grbl</text>
    <text x="896" y="92">transport</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#5b6b7c">
    <text x="606" y="114">SVG → contours</text>
    <text x="606" y="132">→ G-code</text>
    <text x="751" y="114">client · streamer</text>
    <text x="751" y="132">statut, pause, arrêt</text>
    <text x="896" y="114">WebSerial (USB)</text>
    <text x="896" y="132">ou mockGrbl</text>
  </g>
  <g stroke="#1f2a37" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M672 109 H685"/>
    <path d="M817 109 H830"/>
  </g>
  <text x="540" y="180" font-size="12.5" fill="#5b6b7c">UI : App · components · hooks (React)</text>
  <text x="540" y="204" font-size="12.5" fill="#5b6b7c">importé par l'app racine via l'alias @laser (adapter.ts)</text>
  <text x="540" y="224" font-size="12.5" fill="#5b6b7c">sans copie : planche → LaserJob</text>

  <!-- Raspberry Pi -->
  <rect x="520" y="270" width="460" height="280" rx="14" fill="#eaf5ea" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="540" y="298" font-size="15" font-weight="700" fill="#1f2a37">pi/ (déployé sur le Raspberry Pi)</text>

  <rect x="540" y="316" width="200" height="214" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="640" y="342" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2a37">nichoir/ (Python, Flask)</text>
  <g font-size="12" text-anchor="middle" fill="#5b6b7c">
    <text x="640" y="366">port 8080, service systemd</text>
    <text x="640" y="392">web : routes /api/*, /video/*</text>
    <text x="640" y="412">state · reading · history</text>
    <text x="640" y="432">auto · alerts · power</text>
    <text x="640" y="452">commands · settings</text>
    <text x="640" y="472">hardware : I2C, 1-Wire,</text>
    <text x="640" y="490">GPIO, caméras (optionnel)</text>
    <text x="640" y="516">mode simulé : NICHOIR_MOCK=1</text>
  </g>

  <rect x="790" y="316" width="170" height="214" rx="10" fill="#ffffff" stroke="#1f2a37" stroke-width="1.5"/>
  <text x="875" y="342" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2a37">site/ → web/</text>
  <g font-size="12" text-anchor="middle" fill="#5b6b7c">
    <text x="875" y="366">React + TypeScript</text>
    <text x="875" y="384">projet autonome</text>
    <text x="875" y="410">api/ : fetch /api/*</text>
    <text x="875" y="430">useDeviceState :</text>
    <text x="875" y="448">relit l'état (5 s)</text>
    <text x="875" y="474">compilé dans web/</text>
    <text x="875" y="492">(commité)</text>
    <text x="875" y="516">nginx optionnel</text>
  </g>
  <path d="M790 420 H742" stroke="#1f2a37" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="766" y="412" font-size="11" text-anchor="middle" fill="#1f2a37">HTTP</text>

  <!-- Build et deploiement -->
  <rect x="20" y="575" width="960" height="95" rx="14" fill="#fdf0f0" stroke="#b04a4a" stroke-width="1.5"/>
  <text x="40" y="602" font-size="15" font-weight="700" fill="#1f2a37">Build, tests et déploiement</text>
  <g font-size="12.5" fill="#5b6b7c">
    <text x="40" y="626">npm run build → dist/ → .github/workflows/pages.yml → GitHub Pages (à chaque push sur main)</text>
    <text x="40" y="646">npm run build:pi : pi/site → pi/web (commité, le Pi n'a pas Node), puis copie sur le Pi</text>
    <text x="40" y="664">Vitest (racine, laser-control, pi/site) · pytest (pi/tests)</text>
  </g>
</svg>
